# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-tests.txt ]; then pip install -r requirements-tests.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v3
      with:
        images: radiohead.retailshake.com/scrapydweb
        tags: |
            type=ref,event=branch
            type=ref,event=pr
    - name: Build collections image
      run: docker build -f docker/Dockerfile.collections -t scrapydweb-collections:ci .
    - name: Test collections image
      run: |
        docker build -f docker/Dockerfile.collections-test --build-arg COLLECTIONS_IMAGE=scrapydweb-collections:ci -t scrapydweb-collections:test-ci .
        docker run --rm --network none scrapydweb-collections:test-ci
    - name: Publish tested image
      if: github.event_name == 'push'
      env:
        IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          docker tag scrapydweb-collections:ci "$tag"
          docker push "$tag"
        done <<< "$IMAGE_TAGS"
